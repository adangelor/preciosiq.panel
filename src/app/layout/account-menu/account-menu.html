<button
  class="account-menu__trigger"
  type="button"
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Cuenta"
>
  @if (profile()?.profilePictureUrl) {
    <img class="account-menu__avatar" [src]="resolveProfilePictureUrl(profile()?.profilePictureUrl)" alt="" />
  } @else {
    <span class="account-menu__avatar account-menu__avatar--initials">{{ initials() }}</span>
  }
</button>

<mat-menu #menu="matMenu" xPosition="before">
  @if (profile(); as p) {
    <div class="account-menu__header">
      <strong>{{ p.firstName || p.email }}</strong>
      <span class="account-menu__email">{{ p.email }}</span>
    </div>
    <mat-divider></mat-divider>
  }

  <a mat-menu-item routerLink="/perfil">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </a>
  <a mat-menu-item routerLink="/perfil/cambiar-contrasena">
    <mat-icon>lock</mat-icon>
    <span>Cambiar contraseña</span>
  </a>
  <button mat-menu-item type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Salir</span>
  </button>
</mat-menu>
