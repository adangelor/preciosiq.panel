<div class="register">
  <app-back-link fallback="/login" />

  <h1>Creá tu cuenta en PreciosIQ</h1>
  <p class="subtitle">Usuario y contraseña propios, para entrar directo sin código por mail.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="register__form">
    <div class="register__row">
      <label class="register__grow">
        Nombre
        <input type="text" formControlName="firstName" autocomplete="given-name" />
      </label>
      <label class="register__grow">
        Apellido
        <input type="text" formControlName="lastName" autocomplete="family-name" />
      </label>
    </div>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" placeholder="vos@tucomercio.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Ingresá un email válido.</span>
      }
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Mínimo 6 caracteres.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <p class="hint">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a>.</p>
  </form>
</div>
